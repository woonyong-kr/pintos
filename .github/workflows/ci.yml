name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install x86 emulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86
      - name: Run thread tests
        shell: bash
        run: |
          source pintos/activate
          make -C pintos/threads check
      - name: Run virtual-memory tests
        shell: bash
        run: |
          source pintos/activate
          make -C pintos/vm check
